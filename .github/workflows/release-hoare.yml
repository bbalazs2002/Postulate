name: Release Hoare

# Triggered by pushing a tag like "hoare-v0.1.0" -- separate from
# Edsger's own "edsger-vX" tags (see release-edsger.yml) since the two
# compilers are versioned and released independently.
on:
  push:
    tags:
      - "hoare-v*"

permissions:
  contents: write   # create the GitHub Release and upload assets
  packages: write   # push the release image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/hoare-}" >> "$GITHUB_OUTPUT"

      # Shared with test-hoare.yml (the manually-triggered dry run) so
      # the two workflows can't drift apart on the actual build/test
      # commands -- see the script's own header comment.
      - name: Build and test images
        run: Hoare/scripts/ci_build_and_test.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the release image to GHCR
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/postulate-hoare"
          docker tag postulate-hoare-release "$IMAGE:$VERSION"
          docker tag postulate-hoare-release "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      # See Hoare/scripts/bundle_release.sh's own header comment for
      # what "self-contained" means here and its portability trade-off
      # against the Docker image just pushed above.
      - name: Build the self-contained tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Hoare/scripts/bundle_release.sh "$VERSION" dist

      - name: Create the GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/postulate-hoare-${VERSION}-linux-x86_64.tar.gz" \
            --title "Hoare $VERSION" \
            --notes "Postulate v0 compiler (Stage 0).

          - **Docker (recommended)**: \`docker run --rm -v \${PWD}:/work ghcr.io/${{ github.repository_owner }}/postulate-hoare:$VERSION test.ptl\`
          - **Standalone tarball**: download \`postulate-hoare-$VERSION-linux-x86_64.tar.gz\`, extract it, run \`./hoare test.ptl\`. Bundles nasm/ld and their shared libraries — no separate install needed on a compatible x86-64 Linux host (see README.md's own \"Release\" section for exactly what that covers).
          - **Source**: the auto-generated \"Source code\" zip/tar.gz below — this tag lives on the \`hoare-release\` branch, which contains only Hoare's own source and docs (not the full Postulate monorepo).

          Language reference: [docs/postulate_v0_language_reference.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/postulate_v0_language_reference.md)"
