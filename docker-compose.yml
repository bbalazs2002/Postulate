services:
  edsger-dev:
    build:
      context: .
      dockerfile: Edsger_v0/Dockerfile
    image: postulate-edsger
    container_name: postulate-edsger-dev
    stdin_open: true  # -i opció (interaktív bemenet)
    tty: true         # -t opció (pszeudo-TTY a terminálhoz)
    entrypoint: ["/bin/bash"]
    volumes:
      - ./Edsger_v0:/workspace/Edsger
      - ./Hoare:/workspace/Hoare
