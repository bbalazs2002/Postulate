[package]
name = "tree-sitter-postulate-parser"
description = "This is the main parser for the Postulate programming language"
version = "0.1.0"
authors = ["Balthes Balazs <balthes.balazs@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "postulate-parser"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/bbalazs2002/Postulate.git"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.12"
